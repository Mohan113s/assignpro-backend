spring.application.name=assignpro-backend

# ===============================
# Server
# ===============================
server.port=${PORT:8081}

# ===============================
# Database
# Spring Boot AUTO-DETECTS driver and dialect from the URL:
#   jdbc:h2:mem:...        → H2 driver + H2Dialect       (local STS, no env var set)
#   jdbc:postgresql://...  → PostgreSQL driver + PGDialect (Render / AWS RDS)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:assignprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# driver-class-name is intentionally NOT set — Spring Boot detects from URL automatically

# H2 console for local dev: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# ===============================
# JPA / Hibernate
# dialect is intentionally NOT set — auto-detected from connected driver
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# Connection Pool (Hikari)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.assignpro=INFO

# ===============================
# JWT (secret from env var, fallback for local dev only)
# On Render: set JWT_SECRET to a long random string
# ===============================
app.jwt.secret=${JWT_SECRET:AssignProSecretKeyAssignProSecretKeyForDev1234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Email (OPTIONAL - registration succeeds even if email is disabled)
# To enable: set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD on Render
# Leave MAIL_ENABLED=false to skip sending emails entirely (default)
# ===============================
app.email.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@assignpro.com}
spring.mail.password=${MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
